<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0910">
<meta name="description" content="Respite: a slow, grim idle RPG. Your crews work, your hunt goes on, the camp keeps its fire.">
<title>Respite</title>
<link rel="icon" type="image/webp" href="assets/respite-logo.webp">
<link rel="apple-touch-icon" href="assets/respite-logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
<!-- Per-page sheets, last: both lean on classes pages.css defines. -->
<link rel="stylesheet" href="css/character.css">
<link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to the page</a>

<!--
  The shell. main.js fills the mount points below; every id here is part of
  the contract in UI-KIT.md ("Shell mount ids"). Pages render into #view.

  The icons baked in below are copies of icon() output, width and height
  attributes and all. They look redundant next to .ico but they are not: an
  <svg> with only a viewBox has no size of its own, and Safari lays these out
  from the attributes on the first paint, which is why the bar came up blank
  until a popup forced a repaint. Keep them in step with icons.js.
-->
<div class="app" id="app" data-drawer="closed">

  <!-- ================= TOPBAR ================= -->
  <header class="topbar" id="topbar">
    <button type="button" class="tb-icon-btn tb-menu" id="tbMenu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

    <a class="tb-brand" id="tbBrand" href="#/character" aria-label="Respite, your character">
      <img class="tb-logo" src="assets/respite-logo.webp" alt="" width="32" height="32">
      <span class="tb-word">Respite</span>
    </a>

    <nav class="tb-crumbs" id="tbCrumbs" aria-label="Breadcrumb"></nav>

    <div class="tb-acts" id="tbActs">
      <div class="act" id="tbBench" data-kind="bench" data-state="idle">
        <a class="act-link" id="tbBenchLink" href="#/character">
          <span class="act-ico" id="tbBenchIcon" aria-hidden="true"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7.9 18.4c-.1-.1-.2-.2-.2-.3l-1.4-1c-.1-.1-.2-.2-.3-.2l5.1-6.4 1.8 1.4zm-6 4.4c-.4-.3-.5-.9-.2-1.3l.5-.6 2.8 2.1-.5 .6c-.3 .4-.9 .5-1.3 .2zm1.6-3.6l2.8 2.2-1 1.2-2.8-2.2zm1-1.3c.3-.4 .9-.5 1.3-.2l1.3 1c.5 .4 .5 .9 .2 1.3l-.7 .9-2.8-2.1zm4.4-17.6c.3-.3 .7-.4 1.1-.1l4.6 3.6-4.1 5.2-4.6-3.6c-.3-.3-.4-.7-.2-1zm9.1 6.1c.3 .3 .7 .7 1 1l3.3 4.3c.2 .3 .2 .8 0 1.1l-1.2 1.5c-.2 .3-.7 .4-1.1 .3l-4.9-2.2c-.4-.2-.9-.5-1.2-.8l-2.6-1.9 4.1-5.3z"/></svg></span>
          <span class="act-text">
            <span class="act-name" id="tbBenchName">Idle</span>
            <span class="act-short" id="tbBenchShort">Idle</span>
            <span class="act-meta" id="tbBenchMeta">No crews at work</span>
          </span>
          <span class="act-bar" aria-hidden="true"><i id="tbBenchBar"></i></span>
        </a>
        <button type="button" class="act-stop" id="tbBenchRestart" aria-label="Start this work over" hidden><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 11.5a8 8 0 1 1-2.3-5.1"/><path d="M20 4v5h-5"/></svg></button>
      </div>

      <div class="act" id="tbHunt" data-kind="hunt" data-state="idle">
        <a class="act-link" id="tbHuntLink" href="#/skill/warfare">
          <span class="act-ico" id="tbHuntIcon" aria-hidden="true"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M1.1 .6l3.6 .8c.2 .1 .5 .2 .6 .4l6 6-1.1 1.1-5-5c-.2-.2-.5-.2-.7 0-.2 .2-.2 .6 0 .8l4.9 4.9-1 1.1-6.1-5.9c-.1-.2-.3-.5-.3-.7zm15.2 12.3l-2.8 2.9-.7-.8 1-1c.2 .1 .5 .1 .6-.1 .2-.2 .2-.4 .1-.6l1.1-1.1zm2.2 6.9l1.9-1.9 .9 1c-.4 .1-.8 .4-1.1 .7-.4 .4-.6 .8-.7 1.2zm1.4-2.3l-1.9 1.8-.8-.8 1.8-1.9zm-6.2 3.1c-.2 .2-.5 .3-.7 .4 .3-.4 .6-1 .6-1.5 0-.4-.3-1.1-.7-1.5l-.1-.2 6.5-6.5c.4-.5 1.1-.5 1.5 0l.4 .3c.4 .4 .4 1.1 0 1.5zm7.1 2.3c-.7-.7-.7-1.9 0-2.6 .8-.8 1.9-.8 2.7 0 .7 .7 .7 1.9 0 2.6-.8 .7-1.9 .7-2.7 0zm2.1-22.3l-.9 3.5c0 .2-.2 .5-.3 .7l-11.2 11-2.8-2.9 11-11.1c.1-.2 .4-.3 .6-.4zm-13.3 13.3c.2 .2 .5 .2 .7 0l.6-.6-.7-.8-.6 .6c-.2 .2-.2 .6 0 .8zm9.9-9.2c.2-.2 .2-.6 0-.8-.2-.2-.5-.2-.7 0l-5.7 5.7 .7 .8zm-15.9 13.2l1.9 1.9-1 1c-.1-.4-.3-.8-.7-1.2-.3-.3-.7-.6-1.1-.7zm2.4 1.4l-1.9-1.8 .9-.9 1.8 1.9zm-3.2-6.2c-.4-.4-.4-1.1 0-1.5l.4-.3c.4-.5 1.1-.5 1.5 0l7.5 7.5c.4 .4 .4 1.1 0 1.5l-.4 .3c-.4 .5-1.1 .5-1.5 0zm-2.3 7.2c.8-.8 1.9-.8 2.7 0 .7 .7 .7 1.9 0 2.6-.8 .7-1.9 .7-2.7 0-.7-.7-.7-1.9 0-2.6zm12.3-8.9l-.8-.7-.8 .7 .8 .8z"/></svg></span>
          <span class="act-text">
            <span class="act-name" id="tbHuntName">Idle</span>
            <span class="act-short" id="tbHuntShort">Idle</span>
            <span class="act-meta" id="tbHuntMeta">Nobody is hunting</span>
          </span>
          <span class="act-bar" aria-hidden="true"><i id="tbHuntBar"></i></span>
        </a>
        <button type="button" class="act-stop" id="tbHuntRestart" aria-label="Leave combat" hidden><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>
    </div>

    <div class="tb-stats">
      <div class="tb-gold" id="tbGold" title="Gold"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M0 12c0-6.6 5.4-12 12-12 6.6 0 12 5.4 12 12 0 6.6-5.4 12-12 12-6.6 0-12-5.4-12-12zm12 9.6c5.3 0 9.6-4.3 9.6-9.6 0-5.3-4.3-9.6-9.6-9.6-5.3 0-9.6 4.3-9.6 9.6 0 5.3 4.3 9.6 9.6 9.6zm-8.7-9.6c0-4.8 3.9-8.7 8.7-8.7 4.8 0 8.7 3.9 8.7 8.7 0 4.8-3.9 8.7-8.7 8.7-4.8 0-8.7-3.9-8.7-8.7zm6.9-1.8c-.9 1-4.1 1.8-4.1 1.8 0 0 3.2 .8 4.1 1.8 1 .9 1.8 4.1 1.8 4.1 0 0 .8-3.2 1.8-4.1 .9-1 4.1-1.8 4.1-1.8 0 0-3.2-.8-4.1-1.8-1-.9-1.8-4.1-1.8-4.1 0 0-.8 3.2-1.8 4.1z"/></svg><span id="tbGoldText">0</span><span class="sr-only"> gold</span></div>

      <div class="tb-hp" id="tbHp" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20">
        <svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 23.3c0 0-6.6-5.4-8.5-7.7-2-2.3-3.1-4.3-3.4-6.3-.3-2 .3-4.4 1.3-5.8 1-1.4 3.3-2.5 4.8-2.7 1.4-.2 3 .7 4 1.3 1 .7 1.8 2.7 1.8 2.7 0 0 .8-2 1.8-2.7 1-.6 2.6-1.5 4-1.3 1.5 .2 3.8 1.3 4.8 2.7 1 1.4 1.6 3.8 1.3 5.8-.3 2-1.4 4-3.4 6.3-1.9 2.3-8.5 7.7-8.5 7.7z"/></svg>
        <span class="tb-hpbar"><i id="tbHpFill"></i></span>
        <span class="tb-hptext" id="tbHpText">20/20</span>
      </div>

      <button type="button" class="conn" id="tbConn" data-state="guest">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="tbConnText">Guest</span>
      </button>

      <button type="button" class="tb-icon-btn tb-settings" id="tbSettings" aria-label="Settings and account"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M9.2 3.7l.5-3.1c.1-.3 .4-.6 .8-.6h3c.4 0 .7 .3 .8 .6l.5 3.1c.4 .1 .8 .3 1.1 .4l2.5-1.7c.3-.2 .8-.2 1 .1l2.1 2.1c.3 .2 .3 .7 .1 1l-1.7 2.5c.1 .3 .3 .7 .4 1.1l3.1 .5c.3 .1 .6 .4 .6 .8v3c0 .4-.3 .7-.6 .8l-3.1 .5c-.1 .4-.3 .8-.4 1.1l1.7 2.5c.2 .3 .2 .8-.1 1l-2.1 2.1c-.2 .3-.7 .3-1 .1l-2.5-1.7c-.3 .1-.7 .3-1.1 .4l-.5 3.1c-.1 .3-.4 .6-.8 .6h-3c-.4 0-.7-.3-.8-.6l-.5-3.1c-.4-.1-.8-.3-1.1-.4l-2.5 1.7c-.3 .2-.8 .2-1-.1l-2.1-2.1c-.3-.2-.3-.7-.1-1l1.7-2.5c-.1-.3-.3-.7-.4-1.1l-3.1-.5c-.3-.1-.6-.4-.6-.8v-3c0-.4 .3-.7 .6-.8l3.1-.5c.1-.4 .3-.8 .4-1.1l-1.7-2.5c-.2-.3-.2-.8 .1-1l2.1-2.1c.2-.3 .7-.3 1-.1l2.5 1.7c.3-.1 .7-.3 1.1-.4zm2.8 11.9c2 0 3.6-1.6 3.6-3.6 0-2-1.6-3.6-3.6-3.6-2 0-3.6 1.6-3.6 3.6 0 2 1.6 3.6 3.6 3.6z"/></svg><span class="tb-dot" aria-hidden="true"></span></button>
    </div>
  </header>

  <div class="shell">

    <!-- ================= SIDEBAR (a drawer below 1024px) ================= -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="drawer-head">
        <a class="tb-brand" href="#/character">
          <img class="tb-logo" src="assets/respite-logo.webp" alt="" width="28" height="28">
          <span class="tb-word">Respite</span>
        </a>
        <button type="button" class="btn btn-quiet btn-icon" id="drawerClose" aria-label="Close navigation"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>

      <nav class="nav" id="nav" aria-label="Main">
        <section class="nav-group" id="navVanguard" aria-labelledby="navVanguardHead">
          <h2 class="nav-head" id="navVanguardHead">The Vanguard</h2>
          <ul class="nav-list" id="navVanguardList"></ul>
        </section>
        <section class="nav-group" id="navRealm" aria-labelledby="navRealmHead">
          <h2 class="nav-head" id="navRealmHead">The Realm</h2>
          <ul class="nav-list" id="navRealmList"></ul>
        </section>
        <section class="nav-group" id="navCamp" aria-labelledby="navCampHead">
          <h2 class="nav-head" id="navCampHead">The Camp</h2>
          <ul class="nav-list" id="navCampList"></ul>
        </section>
        <section class="nav-group" id="navTrades" aria-labelledby="navTradesHead">
          <h2 class="nav-head" id="navTradesHead">Trades</h2>
          <ul class="nav-list" id="navTradesList"></ul>
        </section>
        <section class="nav-group" id="navArtisans" aria-labelledby="navArtisansHead">
          <h2 class="nav-head" id="navArtisansHead">Artisans</h2>
          <ul class="nav-list" id="navArtisansList"></ul>
        </section>
      </nav>

      <div class="side-foot" id="sideFoot">
        <div class="weather" id="weather" hidden></div>
      </div>
    </aside>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

    <!-- ================= MAIN ================= -->
    <main class="main" id="main">
      <div class="banner-dock" id="bannerDock"></div>

      <div class="view" id="view" tabindex="-1">
        <div class="boot" id="boot">
          <img class="boot-mark" src="assets/respite-logo.webp" alt="" width="56" height="56">
          <span>Waking the camp</span>
        </div>
      </div>

      <section class="log-dock" id="logDock" aria-label="Camp log" hidden></section>
    </main>
  </div>
</div>

<!-- ================= FLOATING LAYERS ================= -->
<div id="modalRoot"></div>
<div class="tip-layer" id="tipLayer"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
<div class="sr-only" id="srLive" aria-live="polite"></div>

<noscript>
  <div class="banner noscript" data-tone="ember">
    <div class="banner-text"><b>Respite needs JavaScript.</b>The camp cannot run without it.</div>
  </div>
</noscript>

<script type="module" src="src/client/main.js"></script>
</body>
</html>
