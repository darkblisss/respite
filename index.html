<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= TASKBAR ================= -->
<header class="taskbar">
  <div class="tb-brand">
    <span class="tb-mark">&#127769;</span>
    <span class="tb-name">Respite</span>
  </div>

  <div class="tb-slot">
    <div class="tb-slot-head">
      <span class="tb-slot-label">Skilling</span>
      <span class="tb-slot-title" id="tbSkillTitle">Idle</span>
      <button class="tb-clear" id="tbSkillClear" title="Finish the current action, then stop">&#8635;</button>
    </div>
    <div class="tb-bar"><div class="tb-bar-fill" id="tbSkillBar"></div></div>
    <div class="tb-proj" id="tbSkillProj">Nothing tasked.</div>
  </div>

  <div class="tb-slot">
    <div class="tb-slot-head">
      <span class="tb-slot-label">Combat</span>
      <span class="tb-slot-title" id="tbCombatTitle">Idle</span>
      <button class="tb-clear" id="tbCombatClear" title="Finish the current fight, then stop">&#8635;</button>
    </div>
    <div class="tb-bar"><div class="tb-bar-fill combat" id="tbCombatBar"></div></div>
    <div class="tb-proj" id="tbCombatProj">Nothing tasked.</div>
  </div>

  <div class="tb-right">
    <div class="tb-vital">
      <span class="tb-vital-label">HP</span>
      <div class="hpbar"><div class="hpbar-fill" id="hpFill"></div></div>
      <span class="tb-vital-num" id="hpText">10/10</span>
    </div>
    <div class="tb-vital">
      <span class="tb-vital-num gold" id="goldText">0</span>
      <span class="tb-vital-label">gold</span>
    </div>
    <button class="iconbtn" id="settingsBtn" title="Settings and account">&#9881;</button>
  </div>
</header>

<div class="shell">

  <!-- ================= SIDEBAR ================= -->
  <nav class="sidebar">
    <div class="navgroup">
      <button class="tabbtn" data-tab="regions"><span class="tabbtn-icon">&#128506;</span><span>Regions</span></button>
      <div class="navsub" id="regionNav"></div>
    </div>

    <div class="navgroup">
      <button class="tabbtn" data-tab="camp"><span class="tabbtn-icon">&#128296;</span><span>Camp</span></button>
      <div class="navsub" id="campNav"></div>
    </div>

    <div class="navgroup">
      <button class="tabbtn" data-tab="inventory"><span class="tabbtn-icon">&#127890;</span><span>Inventory</span></button>
    </div>

    <div class="navgroup">
      <button class="tabbtn" data-tab="skills"><span class="tabbtn-icon">&#128202;</span><span>Skills</span></button>
    </div>
  </nav>

  <!-- ================= MAIN ================= -->
  <main class="main">

    <!-- ---- REGIONS ---- -->
    <section class="view" id="viewRegions" hidden>
      <div class="hero">
        <img class="hero-img" id="regionImg" alt="" referrerpolicy="no-referrer">
        <div class="hero-body">
          <h1 class="hero-title" id="regionName"></h1>
          <p class="hero-note" id="regionNote"></p>
          <p class="muted tiny" id="regionMeta"></p>
        </div>
      </div>

      <h2 class="section-title">Gathering</h2>
      <div class="cards" id="regionNodes"></div>

      <h2 class="section-title">Prowling here</h2>
      <div class="cards" id="regionMonster"></div>
    </section>

    <!-- ---- CAMP ---- -->
    <section class="view" id="viewCamp" hidden>
      <div class="view-head">
        <h1 class="view-title" id="profTitle"></h1>
        <div class="view-xp">
          <span id="profLevel">Level 1</span>
          <div class="xpbar"><div class="xpbar-fill" id="profXpFill"></div></div>
          <span class="muted" id="profXpText"></span>
        </div>
      </div>
      <p class="view-note" id="profNote"></p>
      <div class="cards" id="profActions"></div>
    </section>

    <!-- ---- INVENTORY ---- -->
    <section class="view" id="viewInventory" hidden>
      <div class="inv-shell">
        <div class="storage-tabs">
          <button class="stab on" data-store="inv" title="Bag">Bag</button>
          <button class="stab" data-store="bank" title="Vault">Vault</button>
        </div>

        <div class="inv-main">
          <div class="view-head">
            <h1 class="view-title" id="storeTitle">Bag</h1>
            <span class="muted nums" id="storeCount"></span>
          </div>
          <p class="view-note" id="storeNote"></p>
          <div class="invgrid" id="invGrid"></div>
          <div class="inv-detail" id="invDetail">Select an item.</div>
        </div>

        <aside class="inv-side">
          <div class="box">
            <h2 class="box-title">Equipped</h2>
            <div class="equip" id="equipList"></div>
          </div>
          <div class="box">
            <h2 class="box-title">Character</h2>
            <div class="statlist" id="statList"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ---- SKILLS ---- -->
    <section class="view" id="viewSkills" hidden>
      <div class="view-head">
        <h1 class="view-title">Skills</h1>
        <span class="muted" id="totalLevelText"></span>
      </div>
      <div class="skilltable" id="skillTable"></div>
    </section>

    <div class="eventlog" id="eventLog"></div>
  </main>
</div>

<!-- ================= SETTINGS ================= -->
<div class="modal-wrap" id="settingsModal" hidden>
  <div class="modal">
    <h2 class="modal-title">Settings</h2>

    <div class="modal-section">
      <h3 class="modal-h3">Account</h3>
      <p class="muted tiny" id="acctStatus"></p>
      <div class="fieldrow" id="acctFields">
        <input class="field" id="acctUser" placeholder="Username" autocomplete="username">
        <input class="field" id="acctPass" type="password" placeholder="Password" autocomplete="current-password">
      </div>
      <div class="btnrow">
        <button class="btn" id="acctCreate">Create</button>
        <button class="btn" id="acctLogin">Log in</button>
        <button class="btn btn-quiet" id="acctLogout" hidden>Log out</button>
      </div>
      <p class="muted tiny" id="acctNote"></p>
    </div>

    <div class="modal-section">
      <h3 class="modal-h3">Save string</h3>
      <textarea class="sharebox" id="shareBox" spellcheck="false"></textarea>
      <div class="btnrow">
        <button class="btn" id="shareCopy">Copy</button>
        <button class="btn" id="shareLoad">Load pasted save</button>
      </div>
    </div>

    <div class="modal-section">
      <div class="btnrow">
        <button class="btn" id="saveBtn">Save now</button>
        <button class="btn btn-danger" id="wipeBtn">Delete this save</button>
        <button class="btn btn-quiet" id="settingsClose">Close</button>
      </div>
      <p class="muted tiny" id="saveNote">Autosaves every 10 seconds.</p>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="game.js"></script>
</body>
</html>
